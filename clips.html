<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SWAY | Clips</title>

    <style>

        /* GENERAL */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: white;
            color: black;
        }

        h1 {
            font-size: 50px;
            font-weight: bold;
        }

        h2 {
            font-size: 28px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        p {
            font-size: 18px;
        }


        /* NAVBAR */

        .whatsapp-btn {
            float: right;
            color: black;
            background-color: #D4AF37;
            padding: 10px 16px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            margin: 5px 10px 0 0;
        }

        .whatsapp-btn:hover {
            background-color: #F5F1E8;
            color: black;
        }

        .logo {
            float: left;
            display: block;
            width: 160px;
            height: 60px;
            padding: 0;
            margin: -5px 15px -5px 5px;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .navbar {
            background-color: black;
            color: white;
            border-radius: 30px;
            padding: 10px;
            font-size: 20px;
            position: sticky;
            top: 0;
            overflow: hidden;
        }

        .navbar a {
            color: #F5F1E8;
            padding: 10px;
        }

        .navbar a:visited {
            color: #B8860B;
        }

        .navbar a:hover {
            color: #FFE5A0;
        }

        .navbar li {
            float: left;
        }

        .navbar ul {
            text-decoration: none;
            list-style: none;
        }


        /* PINS HERO */

        .hero {
            background-image: url("clips hero.png");
            height: 330px;
            margin-top: 26px;
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
        }


        /* PRODUCTS */

        .products {
            padding: 40px 30px;
            text-align: center;
            background-color: rgb(245, 243, 238);
        }

        .products h2 {
            margin-bottom: 30px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            max-width: 1350px;
            margin: auto;
        }

        .product-card {
            background-color: white;
            border-radius: 15px;
            overflow: hidden;
            text-align: center;
            padding-bottom: 20px;
        }

        .product-card img {
            width: 100%;
            height: 360px;
            object-fit: cover;
            display: block;
        }

        .product-card h3 {
            font-size: 20px;
            margin: 15px 10px 8px;
        }

        .product-card p {
            font-size: 17px;
            margin: 5px;
        }

        .product-order {
            display: inline-block;
            background-color: black;
            color: #D4AF37;
            padding: 9px 15px;
            margin-top: 10px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .product-order:hover {
            background-color: #D4AF37;
            color: black;
        }


        /* MOBILE RESPONSIVE */

        /* MOBILE CHANGE */

        @media (max-width: 600px) {

            .navbar {
                overflow: visible;
                text-align: center;
                padding: 10px;
            }

            .logo {
                float: none;
                display: block;
                width: 130px;
                height: 50px;
                margin: 0 auto 5px auto;
            }

            .navbar ul {
                padding: 0;
                margin: 5px 0;
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 3px;
            }

            .navbar li {
                float: none;
            }

            .navbar a {
                font-size: 15px;
                padding: 7px 6px;
            }

            .whatsapp-btn {
                float: none;
                display: inline-block;
                margin: 8px auto 2px auto;
                font-size: 14px;
                padding: 10px 14px;
            }


            /* MOBILE CHANGE */

            .hero {
                height: 220px;
                padding: 15px;
                margin-top: 15px;
                background-position: center;
            }


            /* MOBILE CHANGE */

            .products {
                padding: 30px 12px;
            }

            .products h2 {
                font-size: 22px;
                margin-bottom: 20px;
            }


            /* MOBILE CHANGE */

            .product-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 15px;
                width: 100%;
            }


            /* MOBILE CHANGE */

            .product-card img {
                width: 100%;
                height: 220px;
                object-fit: cover;
            }


            /* MOBILE CHANGE */

            .product-card h3 {
                font-size: 16px;
                margin: 12px 5px 6px;
            }


            /* MOBILE CHANGE */

            .product-card p {
                font-size: 14px;
                margin: 5px 3px;
            }


            /* MOBILE CHANGE */

            .product-order {
                font-size: 12px;
                padding: 9px 7px;
                margin-top: 8px;
                max-width: calc(100% - 10px);
            }


            /* MOBILE CHANGE */

            h1 {
                font-size: 32px;
            }

            h2 {
                font-size: 22px;
            }

            p {
                font-size: 16px;
            }

        }

    </style>
</head>


<body>

           class="whatsapp-btn"

    </nav>

                <a href="https://wa.me/923334554075?text=Hi%21%20I%27d%20like%20to%20order%20Pink%20Tulip%20Both%20sides%20Hair%20Clip%20%28Rs.%20300%29."
                   class="product-order"

            <div class="product-card">

                <a href="https://wa.me/923334554075?text=Hi%21%20I%27d%20like%20to%20order%20Purple%20Tulip%20Both%20sides%20Hair%20Clip%20%28Rs.300%29."
                   class="product-order"
                   target="_blank">
                    Order on WhatsApp
                </a>

            </div>


        </div>

    </section>


</body>

</html>
